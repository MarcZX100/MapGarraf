services:
  mapgarraf:
    build:
      context: .
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-4175}:4173"
    environment:
      PORT: 4173
      DATABASE_PATH: /app/data/busgarraf.sqlite
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_GPS_ACCURACY_METERS: ${MAX_GPS_ACCURACY_METERS:-1000}
      MAX_NEW_REPORTS_PER_MINUTE_PER_IP: ${MAX_NEW_REPORTS_PER_MINUTE_PER_IP:-30}
      MAX_WRITES_PER_MINUTE_PER_IP: ${MAX_WRITES_PER_MINUTE_PER_IP:-300}
      MAX_ACTIVE_REPORTS_PER_DIRECTION: ${MAX_ACTIVE_REPORTS_PER_DIRECTION:-60}
    volumes:
      - mapgarraf-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mapgarraf-data:
